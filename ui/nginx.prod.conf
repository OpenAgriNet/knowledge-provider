server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Relative redirects (no scheme/host/port) — nginx only knows it's on
    # port 80 internally, so an absolute redirect silently drops whatever
    # host port Docker actually mapped this to (e.g. 3011), sending the
    # browser to the wrong port. Relative preserves whatever the browser
    # actually used to reach this container. Behind a real reverse proxy
    # this doesn't matter either way, since the proxy already hides the
    # internal port — but it matters for any direct/local access.
    absolute_redirect off;

    # Health for compose / deploy script
    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Never serve the SPA at domain root — always under /docs-pipeline/*
    location = / {
        return 302 /docs-pipeline/;
    }

    location /docs-pipeline/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /docs-pipeline/index.html;
    }

    # Anything else → app base
    location / {
        return 302 /docs-pipeline/;
    }
}
