# Codecov configuration.
#
# Two coverage gates run on every PR, each with a distinct job:
#   - coverage's fail_under (pyproject.toml, [tool.coverage.report]) is the
#     absolute floor. It also runs locally, so a drop is visible before a push.
#   - the `project` status below is the ratchet: it compares against main and
#     fails on erosion the fixed floor would let through (e.g. 52% -> 48%).
#
# `paths` is scoped to pipeline/ to match --cov=pipeline exactly, so the two
# gates can never disagree. It also means a docs-only or config-only PR changes
# no pipeline/ coverage and passes untouched, while a PR that slips one untested
# pipeline/ file in alongside doc edits is still caught.
#
# ui/ is deliberately unmeasured: it has no tests yet (passWithNoTests in
# ui/vitest.config.js) and its coverage reporter emits only text and html, so
# there is no report for Codecov to read. Add a `ui` flag here once the vitest
# suite exists and emits lcov.
coverage:
  status:
    project:
      default:
        target: auto # baseline is main
        threshold: 2% # tolerate a 2% dip, fail beyond it
        paths:
          - "pipeline/"
    # No patch gate: coverage is judged on the repo total, not on the diff.
    patch: false

comment:
  layout: "reach, diff, flags, files"
