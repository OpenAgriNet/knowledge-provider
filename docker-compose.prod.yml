# Deployment compose — pulls pre-built GHCR images, never builds from source.
# The deployment machine needs this file + .env only, not the repo checkout.
#
# Usage:
#   cp .env.example .env    # fill all secrets, set IMAGE_TAG to a published tag
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# For local development with source builds instead, use docker-compose.yml.
#
# Profiles:
#   (default) — all core services
#   ops       — also starts temporal-ui
#
# Host ports (all bound to 127.0.0.1 for nginx reverse-proxy; override in .env):
#   API          127.0.0.1:${API_HOST_PORT:-8011}:8001
#   UI           127.0.0.1:${UI_HOST_PORT:-3011}:80
#   Keycloak     127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080
#   Temporal     127.0.0.1:7233:7233
#   MinIO API    127.0.0.1:9000:9000
#   MinIO UI     127.0.0.1:9001:9001
#   Temporal UI  127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080  (profile: ops)

services:

  # ---------------------------------------------------------------------------
  # Temporal infrastructure
  # ---------------------------------------------------------------------------
  temporal-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080"
    restart: unless-stopped
    profiles:
      - ops

  # ---------------------------------------------------------------------------
  # MinIO object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Creates the default bucket on first boot then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET:-documents} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    restart: "no"

  # ---------------------------------------------------------------------------
  # Keycloak (auth) — ghcr.io/openagrinet/knowledge-provider-keycloak bakes in
  # the same JAR/realm-import as keycloak/Dockerfile builds locally.
  #
  # SMTP details come exclusively from .env (KC_SMTP_* vars) — nothing is
  # hard-coded in the image or in this file.
  # ---------------------------------------------------------------------------
  # TODO: switch back to ghcr.io/openagrinet/... once this is merged into the
  # real OpenAgriNet repo — these currently point at a personal GHCR
  # namespace for learning/testing (see publish.yml, which already computes
  # the owner dynamically and needs no change for that move).
  keycloak:
    image: ghcr.io/yaseenahmed1407/knowledge-provider-keycloak:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # DB connection — external Postgres server.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST}:${KC_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}?sslmode=require
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Admin account bootstrap (Keycloak 26.x var names).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Hostname — update KC_HOSTNAME in .env to your public URL in prod.
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # When nginx proxies /auth/ → container, tell Keycloak the path prefix.
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      # SMTP (email-OTP plugin reads the realm's SMTP settings).
      KC_SPI_EMAIL_SENDER_HOST: ${KC_SMTP_HOST}
      KC_SPI_EMAIL_SENDER_PORT: ${KC_SMTP_PORT:-587}
      KC_SPI_EMAIL_SENDER_FROM: ${KC_SMTP_FROM}
      KC_SPI_EMAIL_SENDER_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-BharatVistaar}
      KC_SPI_EMAIL_SENDER_AUTH: ${KC_SMTP_AUTH:-true}
      KC_SPI_EMAIL_SENDER_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_SPI_EMAIL_SENDER_SSL: ${KC_SMTP_SSL:-false}
      KC_SPI_EMAIL_SENDER_USER: ${KC_SMTP_USERNAME}
      KC_SPI_EMAIL_SENDER_PASSWORD: ${KC_SMTP_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    # --import-realm is a no-op if the realm already exists, so safe to leave on.
    command: start --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline API
  # Same image as worker; only command: differs (see docs/SYSTEM_DESIGN.md #13).
  # env_file loads all config; environment: only overrides Docker-network
  # addresses and container paths (these must win over localhost values in .env).
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/yaseenahmed1407/knowledge-provider:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # Docker-network overrides — these replace the localhost values in .env
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_DB_PATH: /data/documents.db
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      # HF cache path propagated into the container
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8011}:8001"
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8001
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline Worker
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/yaseenahmed1407/knowledge-provider:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_DB_PATH: /data/documents.db
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m pipeline.worker
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React UI
  # VITE_* values are baked in at image-build time (in CI), not overridable
  # here — see ui/Dockerfile.prod. This image is tied to the deployment
  # target CI built it for.
  # ---------------------------------------------------------------------------
  ui:
    image: ghcr.io/yaseenahmed1407/knowledge-provider-ui:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-3011}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-db-data:
  keycloak-data:
  minio-data:
  sqlite-data:
  documents-data:
