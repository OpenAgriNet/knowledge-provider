openapi: 3.1.0
info:
  title: Knowledge Provider Search API
  description: Search and chunk lookup. SearchRequest is generated from the runtime model by scripts/export_search_contract.py.
    See docs/SEARCH.md for authorization, ranking and BV examples.
  version: 1.1.0
  contact:
    name: knowledge-provider (docs-pipeline)
servers:
- url: http://localhost:8001
  description: Local dev
security:
- bearerAuth: []
paths:
  /search:
    post:
      operationId: runSearch
      summary: Vector / hybrid semantic search over an index
      description: 'Runs a search against the configured vector store (Qdrant). Requires

        the `search` permission. Any field omitted from the request body

        falls back to the persisted `SearchSettings` (see `GET /settings/search`),

        then to the hardcoded defaults shown below.

        '
      tags:
      - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              minimal:
                summary: Minimal request
                value:
                  query: PM-KISAN eligibility
              full:
                summary: Fully specified request
                value:
                  query: soil health card scheme
                  index_name: documents-index
                  search_mode: HYBRID
                  top_k: 10
                  hybrid_alpha: 0.6
                  rerank_mode: none
              one_group:
                summary: Only one group's documents (e.g. a state's DSS)
                value:
                  query: cotton pest advisory
                  group: mh
              one_provider:
                summary: Only the chunks one network provider publishes
                value:
                  query: cotton pest advisory
                  provider_id: mh.provider.oan.dev
              bv_recorded_query:
                summary: Recorded BV question with exact scheme identity
                value:
                  query: PM Kisan overview
                  group: bv
                  document_kind: scheme
                  document_code: pk
                  search_mode: TENSOR
                  top_k: 10
                  candidate_cap: 80
                  max_chunks_per_doc: 10
              network_release:
                summary: Authorized serving network; requires a provisioned principal grant
                value:
                  query: PM Kisan overview
                  group: bv
                  document_kind: scheme
                  document_code: pk
                  search_mode: TENSOR
                  top_k: 10
                  candidate_cap: 80
                  max_chunks_per_doc: 10
                  network_id: oan.dev
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Missing/empty query, malformed valid_on, non-string group, non-string provider_id, or the underlying
            vector-store search failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '403':
          description: Caller lacks the `search` permission
  /chunks/search:
    get:
      operationId: searchChunksAcrossDocuments
      summary: Keyword search across chunk records (Postgres), for KB maintainer workflows
      description: 'Distinct from `/search`: this queries chunk rows directly in Postgres by

        substring/keyword match, not the vector index. Results are scoped to

        the caller''s instance(s) unless the caller is an unrestricted admin.

        '
      tags:
      - search
      parameters:
      - name: q
        in: query
        description: Keyword search within chunk text
        schema:
          type: string
          default: ''
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: include_excluded
        in: query
        description: Include excluded chunks
        schema:
          type: boolean
          default: false
      - name: stage
        in: query
        description: Optional document stage filter
        schema:
          $ref: '#/components/schemas/DocumentStage'
      responses:
        '200':
          description: Matching chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkSearchResponse'
        '401':
          description: Missing or invalid Bearer token
        '403':
          description: Caller lacks the `search` permission
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Keycloak-issued RS256 JWT. When the server runs with

        AUTH_DISABLED=true (dev default) requests are accepted without a

        valid token and are treated as a local unrestricted admin; a Bearer

        token, if still sent, is decoded (unverified) only to surface the

        caller''s display identity.

        '
  schemas:
    DocumentStage:
      type: string
      enum:
      - registered
      - ocr_processing
      - ocr_review
      - translation_processing
      - translation_review
      - chunking
      - chunk_review
      - ready_for_ingestion
      - ingesting
      - publishing_to_network
      - approval_for_prod
      - ingesting_prod
      - completed
      - failed
    SearchRequest:
      additionalProperties: false
      properties:
        query:
          maxLength: 4096
          minLength: 1
          title: Query
          type: string
        network_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Network Id
        index_name:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Index Name
        document_kind:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Document Kind
        document_code:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Document Code
        document_workflow_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Document Workflow Id
        group:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Group
        provider_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Provider Id
        language:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Language
        strict_language:
          default: false
          title: Strict Language
          type: boolean
        top_k:
          anyOf:
          - maximum: 50
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Top K
        candidate_cap:
          anyOf:
          - maximum: 200
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Candidate Cap
        candidate_multiplier:
          anyOf:
          - maximum: 100
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Candidate Multiplier
        max_chunks_per_doc:
          anyOf:
          - maximum: 50
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Max Chunks Per Doc
        ef_search:
          anyOf:
          - maximum: 10000
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Ef Search
        search_mode:
          anyOf:
          - enum:
            - HYBRID
            - TENSOR
            - LEXICAL
            type: string
          - type: 'null'
          default: null
          title: Search Mode
        hybrid_alpha:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Hybrid Alpha
        hybrid_rrf_k:
          anyOf:
          - maximum: 1000
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Hybrid Rrf K
        ranking_method:
          anyOf:
          - enum:
            - rrf
            - normalize_linear
            type: string
          - type: 'null'
          default: null
          title: Ranking Method
        rerank_mode:
          anyOf:
          - enum:
            - none
            - bm25lite
            - rrf-lite
            - heuristic
            type: string
          - type: 'null'
          default: null
          title: Rerank Mode
        query_expansion_profile:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          default: null
          title: Query Expansion Profile
        use_e5_prefix:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Use E5 Prefix
        exclude_reference:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Exclude Reference
        include_expired:
          default: false
          title: Include Expired
          type: boolean
        include_raw_hits:
          default: false
          title: Include Raw Hits
          type: boolean
        valid_on:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          default: null
          title: Valid On
        crop_subject_ids:
          items:
            type: string
          maxItems: 32
          title: Crop Subject Ids
          type: array
        applicability:
          $ref: '#/components/schemas/KnowledgeFilters'
        metadata_filters:
          $ref: '#/components/schemas/MetadataFilters'
      required:
      - query
      title: SearchRequest
      type: object
    SearchHit:
      type: object
      description: 'A single search result. `_id`/`_score` are always present; all other

        fields are the Qdrant point''s payload and vary by index type (a

        "scheme" index carries scheme_code/scheme_name/etc. instead of the

        document fields). Fields are omitted entirely when null in the

        underlying record, so treat every field but _id/_score as optional.

        '
      required:
      - _id
      - _score
      properties:
        _id:
          type: string
        _score:
          type: number
          format: float
        doc_id:
          type: string
        workflow_id:
          type: string
        instance:
          type: string
        instance_name:
          type: string
        provider_id:
          type: string
          description: The network provider id this chunk's document publishes under. Absent for kinds other than advisory
            and scheme.
        type:
          type: string
        source:
          type: string
        filename:
          type: string
        name_gu:
          type: string
        name_en:
          type: string
        title_en:
          type: string
        title_gu:
          type: string
        doc_language:
          type: string
        category_tags:
          type: array
          items:
            type: string
        doc_short_description:
          type: string
        doc_llm_description:
          type: string
        ingestion_status:
          type: string
        description:
          type: string
        text:
          type: string
        chunk_num:
          type: integer
        chunk_number:
          type: integer
          description: Alias of chunk_num, set when chunk_num is present.
        start_date:
          type: string
          format: date
          description: 'First day this chunk''s document answers searches. Absent on chunks

            ingested before validity existed, which are treated as current.

            '
        end_date:
          type: string
          format: date
          description: 'Last day this chunk''s document answers searches (inclusive).

            Absent on chunks ingested before validity existed.

            '
        section:
          type: string
        token_count:
          type: integer
        page_start:
          type: integer
        page_end:
          type: integer
        is_reference:
          type: boolean
        quality_score:
          type: number
          format: float
        priority_rank:
          type: integer
        priority:
          type: string
        scheme_code:
          type: string
          description: Present on scheme-index hits (type=scheme).
        scheme_name:
          type: string
        scheme_aliases:
          type: array
          items:
            type: string
        chunk_id:
          type: string
        chunk_index:
          type: integer
      additionalProperties: true
    SearchEffectiveConfig:
      type: object
      description: The fully-resolved config actually used for this search (request fields merged with settings/defaults),
        echoed back for debugging.
      properties:
        index_name:
          type: string
        backend:
          type: string
          description: Vector store backend, e.g. qdrant
        query:
          type: string
        search_mode:
          type: string
        store_search_mode:
          type: string
          description: Mode actually sent to the store (HYBRID is remapped to TENSOR on Qdrant).
        top_k:
          type: integer
        candidate_cap:
          type: integer
        candidate_multiplier:
          type: integer
        max_chunks_per_doc:
          type: integer
        use_e5_prefix:
          type: boolean
        exclude_reference:
          type: boolean
        hybrid_alpha:
          type: number
          format: float
        ranking_method:
          type: string
        hybrid_rrf_k:
          type: integer
        ef_search:
          type: integer
        query_expansion_profile:
          type: string
        query_expansion_applied:
          type: boolean
          description: True if the query-expansion profile actually rewrote the query.
        rerank_mode:
          type: string
        group:
          type: string
          nullable: true
          description: The normalised group filter that was applied (e.g. `mh`), or null when the search spanned every group.
        provider_id:
          type: string
          nullable: true
          description: The normalised provider id the search was limited to (e.g. `mh.provider.oan.dev`), or null when no
            provider filter applied.
        filter_string:
          type: string
          nullable: true
          description: Reserved; currently always null.
    SearchResponse:
      type: object
      required:
      - effective_config
      - candidate_count
      - final_count
      - hits
      properties:
        effective_config:
          $ref: '#/components/schemas/SearchEffectiveConfig'
        candidate_count:
          type: integer
          description: Number of candidates returned by the vector store before per-doc capping.
        final_count:
          type: integer
          description: Number of hits actually returned in `hits` (<= top_k).
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        raw_hits:
          type: array
          nullable: true
          description: Only populated when the request sets include_raw_hits=true; the candidate list before per-doc capping/rerank.
          items:
            $ref: '#/components/schemas/SearchHit'
    ChunkSearchResponse:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      - query
      - include_excluded
      - stage
      properties:
        items:
          type: array
          items:
            type: object
            description: Raw chunk record from Postgres (db.search_chunks); shape follows the chunks table, not formally typed
              here.
            additionalProperties: true
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        query:
          type: string
        include_excluded:
          type: boolean
        stage:
          description: Echoes the request's stage filter; absent/null when no filter was applied.
          allOf:
          - $ref: '#/components/schemas/DocumentStage'
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
    AdministrativeArea:
      additionalProperties: false
      properties:
        codeScheme:
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          title: Codescheme
          type: string
        areaCode:
          maxLength: 128
          minLength: 1
          title: Areacode
          type: string
        areaLevel:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Arealevel
        areaName:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Areaname
      required:
      - codeScheme
      - areaCode
      title: AdministrativeArea
      type: object
    KnowledgeFilters:
      additionalProperties: false
      properties:
        subject_categories:
          items:
            maxLength: 128
            minLength: 1
            type: string
          maxItems: 32
          title: Subject Categories
          type: array
        agriculture_subject_ids:
          items:
            type: string
          maxItems: 32
          title: Agriculture Subject Ids
          type: array
        coverage_areas:
          items:
            $ref: '#/components/schemas/AdministrativeArea'
          maxItems: 32
          title: Coverage Areas
          type: array
        seasons:
          items:
            maxLength: 128
            minLength: 1
            type: string
          maxItems: 12
          title: Seasons
          type: array
        tags:
          items:
            maxLength: 128
            minLength: 1
            type: string
          maxItems: 16
          title: Tags
          type: array
      title: KnowledgeFilters
      type: object
    MetadataFilters:
      additionalProperties: false
      properties:
        scope:
          default: document
          enum:
          - document
          - chunk
          title: Scope
          type: string
        category:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Category
        crop:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Crop
        season:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Season
        area:
          anyOf:
          - $ref: '#/components/schemas/AdministrativeArea'
          - type: 'null'
          default: null
      title: MetadataFilters
      type: object
