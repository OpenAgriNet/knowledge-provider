# ─────────────────────────────────────────────────────────────────────────────
# docs-pipeline nginx location blocks
# Paste into your server block BEFORE the catch-all `location / { ... }`
#
# Host port map (see .env — all bind 127.0.0.1 only):
#   API       → 127.0.0.1:${API_HOST_PORT:-8011}
#   UI        → 127.0.0.1:${UI_HOST_PORT:-3011}
#
# After adding these blocks, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────


# The retired shared-key intake URL stays closed. A deployment can expose a
# separately authenticated alias for its provider-scoped /knowledge/intake route.
location = /docs-pipeline-api/webhook { return 404; }
location = /docs-pipeline-api/webhook/ { return 404; }

# ── docs-pipeline FastAPI ─────────────────────────────────────────────────────
location ^~ /docs-pipeline-api/ {
    proxy_pass         http://127.0.0.1:8011/;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_cache        off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    client_max_body_size 100m;
}


# ── docs-pipeline UI (nginx in ui container) ──────────────────────────────────
location ^~ /docs-pipeline/ {
    proxy_pass         http://127.0.0.1:3011/docs-pipeline/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# Google returns to Python at this one exact path. Substitute the deployed realm.
location = /auth/realms/knowledge-provider/broker/google/endpoint {
    proxy_pass http://127.0.0.1:8011/auth/google/callback;
    access_log off;
}

# Keycloak is reachable from the application backend over the private network.
location = /auth { return 404; }
location ^~ /auth/ { return 404; }
