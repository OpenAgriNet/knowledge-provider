name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: pipeline (lint, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=pipeline --cov-report=xml --cov-report=html

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: ui (lint, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest + coverage)
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui
          path: ui/coverage/
          if-no-files-found: ignore
          retention-days: 14
