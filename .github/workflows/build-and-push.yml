name: Build and Push

# Triggers on push to main, or on an annotated release tag, per OAN
# convention: v{SemVer} (e.g. v0.0.1), optionally with an -rcN pre-release
# suffix (e.g. v0.1.1-rc3). Anything else (-test, -beta, ...) does not match,
# on purpose.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      # These are 3 unrelated images (api/worker, ui, keycloak) sharing one
      # matrix — a failure in one shouldn't cancel the other two mid-build.
      fail-fast: false
      matrix:
        include:
          # api + worker are the same image, different entrypoint (see
          # docs/SYSTEM_DESIGN.md #13) — one build here, two containers in
          # docker-compose.prod.yml.
          - image: knowledge-provider
            context: .
            dockerfile: Dockerfile
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: knowledge-provider
            context: .
            dockerfile: Dockerfile
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: knowledge-provider-ui
            context: ./ui
            dockerfile: Dockerfile.prod
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: knowledge-provider-ui
            context: ./ui
            dockerfile: Dockerfile.prod
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: knowledge-provider-keycloak
            context: ./keycloak
            dockerfile: Dockerfile
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: knowledge-provider-keycloak
            context: ./keycloak
            dockerfile: Dockerfile
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Each matrix leg is a separate runner (amd64, arm64) and a separate
      # image, so the cache is keyed on both — otherwise one leg would
      # restore another leg's wrong-arch trivy binary.
      - name: Trivy cache date
        id: trivy-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        uses: actions/cache@v4
        with:
          path: |
            bin/trivy
            ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Trivy (if not cached)
        run: |
          if [ ! -x bin/trivy ]; then
            mkdir -p bin
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b bin
          fi

      - uses: docker/setup-buildx-action@v3

      # Base images (python/node/nginx/etc.) come from Docker Hardened
      # Images, not the plain public tags — this authenticates the pull.
      # TODO: each Dockerfile's FROM line still points at the plain public
      # image (python:3.10-slim, node:20-alpine, nginx:1.27-alpine,
      # quay.io/keycloak/keycloak) — swap in the actual dhi.io repository
      # path once confirmed from the org's DHI catalog. Keycloak likely has
      # no DHI equivalent at all (DHI covers Docker's own curated common
      # images, not third-party vendor images like quay.io/keycloak) — needs
      # its own decision.
      - name: Log in to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GITHUB_TOKEN can be denied write_package when creating a brand-new
      # package under a namespace it doesn't already own — a documented GHCR
      # quirk. GHCR_PAT (classic PAT, write:packages, owned by an account
      # that's a member of the target org) is the standard workaround; falls
      # back to GITHUB_TOKEN when no such secret is set.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # GHCR image refs must be lowercase; github.repository_owner preserves
      # the owner's real case, so it can't be used as-is. Resolves to
      # whichever account or org owns the repo the branch was pushed to.
      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Docker tags can't contain "/" (branch names can, unlike version tags)
      # — sanitize before using github.ref_name in any tag. A no-op for the
      # main trigger and for version tags, both slash-free; only matters if
      # a branch trigger with a "/" in its name is ever added.
      - name: Set image tag
        run: echo "TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # One local, unpushed tag per image+arch — the manifest job below
      # stitches amd64 and arm64 into the single tag users actually pull.
      #
      # load: true instead of push: true — the image lands in this runner's
      # local Docker daemon first so Trivy can scan the exact bytes about to
      # ship, before it is tagged for or pushed to GHCR.
      - name: Build (local, unpushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}

      # Report-only for now (exit-code 0): prints HIGH/CRITICAL findings to
      # the log but never blocks the build/push. Base-image CVEs (e.g. an
      # outdated wheel/transformers version) need real remediation — a
      # dependency bump, verifying compatibility, waiting on an upstream
      # patched tag — not a same-day fix, so this isn't a hard gate yet.
      # Revisit: fail on CRITICAL at least, once the current findings are
      # triaged (see the .trivyignore-vs-upgrade discussion).
      - name: Trivy image scan (report)
        run: |
          ./bin/trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}"

      # Re-tag the already-scanned local image for GHCR and push it. No
      # rebuild, no re-scan.
      - name: Tag and push
        run: |
          LOCAL="${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}"
          DEST="ghcr.io/${OWNER}/${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}"
          docker tag "$LOCAL" "$DEST"
          docker push "$DEST"

  manifest:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image:
          - knowledge-provider
          - knowledge-provider-ui
          - knowledge-provider-keycloak
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set image tag
        run: echo "TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # imagetools create makes one manifest list from the two arch-specific
      # images the build job just pushed — this is what lets `docker pull`
      # resolve the right arch automatically on either amd64 or arm64.
      # :latest is written unconditionally — both triggers (main, a version
      # tag) are legitimate releases, so both should update it.
      - name: Create multi-arch manifest
        run: |
          BASE="ghcr.io/${OWNER}/${{ matrix.image }}"
          docker buildx imagetools create \
            -t "${BASE}:${TAG}" \
            -t "${BASE}:latest" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"
