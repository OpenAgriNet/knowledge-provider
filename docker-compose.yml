# Self-hosted Compose stack with one PostgreSQL server.
# See ENV.md for configuration and migration.
#
# Profiles:
#   (default) — all core services
#   ops       — also starts Temporal UI
#   observability — also starts otel-collector and clickhouse; set
#                   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env
#
# Host ports (all bound to 127.0.0.1 for nginx reverse-proxy; override in .env):
#   API          127.0.0.1:${API_HOST_PORT:-8011}:8001
#   UI           127.0.0.1:${UI_HOST_PORT:-3011}:8080
#   Postgres     127.0.0.1:${DB_HOST_PORT:-5433}:5432
#   Temporal     127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233
#   MinIO API    127.0.0.1:${MINIO_API_PORT:-9000}:9000
#   MinIO UI     127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
#   Temporal UI  127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080  (profile: ops)
#   ClickHouse   127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123  (profile: observability)

services:

  # ---------------------------------------------------------------------------
  # Temporal infrastructure
  # ---------------------------------------------------------------------------
  temporal-schema:
    image: ${KP_TEMPORAL_TOOLS_IMAGE:-dhi.io/temporalio-admin-tools:1.32.2}
    user: "1000:1000"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: temporal
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal-sql-tool --db temporal setup-schema -v 0.0
        temporal-sql-tool --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    image: ${KP_TEMPORAL_IMAGE:-dhi.io/temporalio-server:1.32.2}
    entrypoint: ["/bin/bash", "/opt/knowledge-provider/start-temporal.sh"]
    volumes:
      - ./deploy/start-temporal.sh:/opt/knowledge-provider/start-temporal.sh:ro
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      NUM_HISTORY_SHARDS: ${TEMPORAL_HISTORY_SHARDS:-4}
    ports: ["127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"]
    restart: unless-stopped
    configs:
      - source: temporal-dynamic-config
        target: /etc/temporal/config/dynamicconfig/docker.yaml

  temporal-namespace:
    image: ${KP_TEMPORAL_TOOLS_IMAGE:-dhi.io/temporalio-admin-tools:1.32.2}
    user: "1000:1000"
    depends_on:
      temporal:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if temporal operator cluster health --address temporal:7233; then
            temporal operator namespace describe --namespace default --address temporal:7233 >/dev/null 2>&1 ||
              temporal operator namespace create --namespace default --address temporal:7233
            exit 0
          fi
          sleep 2
        done
        exit 1

  temporal-ui:
    image: ${KP_TEMPORAL_UI_IMAGE:-dhi.io/temporalio-ui:2.58.1}
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080"]
    profiles: [ops]

  # ---------------------------------------------------------------------------
  # MinIO object storage
  # ---------------------------------------------------------------------------
  minio:
    image: ${KP_MINIO_IMAGE:-dhi.io/minio:0.20251015.172955}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-dhi-data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One PostgreSQL server with a separate role for each service.
  # The new volume leaves earlier database volumes available for a logical restore.
  # ---------------------------------------------------------------------------
  postgres:
    image: ${KP_POSTGRES_IMAGE:-dhi.io/postgres:18.7}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kp_db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${POSTGRES_SHARED_BOOTSTRAP_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    ports: ["127.0.0.1:${DB_HOST_PORT:-5433}:5432"]
    restart: unless-stopped
    volumes:
      - shared-postgres-dhi:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-init:
    image: ${KP_POSTGRES_IMAGE:-dhi.io/postgres:18.7}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/knowledge-provider/init-shared-postgres.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-kp_db_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${POSTGRES_SHARED_BOOTSTRAP_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      KP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    volumes:
      - ./deploy/init-shared-postgres.sh:/opt/knowledge-provider/init-shared-postgres.sh:ro

  # ---------------------------------------------------------------------------
  # Qdrant search index. The PostgreSQL data remains the source for a rebuild.
  # ---------------------------------------------------------------------------
  qdrant:
    image: ${KP_QDRANT_IMAGE:-dhi.io/qdrant:1.20.1}
    environment:
      QDRANT__SERVICE__API_KEY: ${VECTOR_DB_API_KEY:?Set VECTOR_DB_API_KEY in .env}
    volumes:
      - qdrant-dhi-data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak realms and browser flows are managed by the deployment operator.
  # ---------------------------------------------------------------------------
  keycloak:
    image: ${KP_KEYCLOAK_IMAGE:-dhi.io/keycloak:26.8.2}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST:-postgres}:${KC_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}?sslmode=${KC_DB_SSLMODE:-disable}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      # Admin account bootstrap (Keycloak 26.x var names).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://keycloak:8080/auth}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      JAVA_OPTS_APPEND: ${JAVA_OPTS_APPEND:-}
    command: start
    volumes:
      - keycloak-dhi-data:/opt/keycloak/data
      - ${KEYCLOAK_EMAIL_OTP_JAR:?Set the reviewed Keycloak email OTP JAR path}:/opt/keycloak/providers/email-otp-authenticator.jar:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline API
  # The image is built once; dev vs prod is controlled by .env values.
  # env_file loads all config; environment: only overrides Docker-network
  # addresses and container paths (these must win over localhost values in .env).
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${KP_ENV_FILE:-.env}
    environment:
      # Docker-network overrides — these replace the localhost values in .env
      TEMPORAL_HOST: temporal:7233
      OBJECT_STORE_CREATE_BUCKET: ${OBJECT_STORE_CREATE_BUCKET:-true}
      VECTOR_DB_URL: http://qdrant:6333
      DATABASE_URL: ${DATABASE_URL:-postgresql://knowledge_provider@postgres:5432/knowledge_provider}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_SHARED_BOOTSTRAP_PASSWORD: ""
      POSTGRES_PASSWORD: ""
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      TEMPORAL_DB_PASSWORD: ""
      KC_DB_PASSWORD: ""
      KC_ADMIN_PASSWORD: ""
      # HF cache path propagated into the container
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HUB_CACHE:-${HF_HOME:-/opt/hf-cache}}
      OTEL_SERVICE_NAME: knowledge-provider-api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8011}:8001"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8001/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8001
    volumes:
      - ${MODEL_CACHE_MOUNT:-model-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline Worker
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${KP_ENV_FILE:-.env}
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      OBJECT_STORE_CREATE_BUCKET: ${OBJECT_STORE_CREATE_BUCKET:-true}
      VECTOR_DB_URL: http://qdrant:6333
      DATABASE_URL: ${DATABASE_URL:-postgresql://knowledge_provider@postgres:5432/knowledge_provider}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_SHARED_BOOTSTRAP_PASSWORD: ""
      POSTGRES_PASSWORD: ""
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      TEMPORAL_DB_PASSWORD: ""
      KC_DB_PASSWORD: ""
      KC_ADMIN_PASSWORD: ""
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HUB_CACHE:-${HF_HOME:-/opt/hf-cache}}
      OTEL_SERVICE_NAME: knowledge-provider-worker
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      api:
        condition: service_healthy
    command: python -m pipeline.worker
    volumes:
      - ${MODEL_CACHE_MOUNT:-model-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React UI
  # Dockerfile.prod builds a static nginx image; VITE_* args come from .env.
  # ---------------------------------------------------------------------------
  ui:
    image: ghcr.io/openagrinet/knowledge-provider-ui:${IMAGE_TAG:-latest}
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/knowledge-provider-api}
        VITE_BASE: ${VITE_BASE:-/knowledge-provider/}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-3011}:8080"
    depends_on:
      - api
    restart: unless-stopped

  otel-collector:
    image: ${KP_OTEL_COLLECTOR_IMAGE:-dhi.io/opentelemetry-collector:0.165.0-contrib}
    profiles: [observability]
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./otel/collector.local.yaml:/etc/otel/collector.yaml:ro
    environment:
      CLICKHOUSE_USER: knowledge
      CLICKHOUSE_PASSWORD: knowledge
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: ${KP_CLICKHOUSE_IMAGE:-dhi.io/clickhouse-server:26.10.2}
    profiles: [observability]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: knowledge
      CLICKHOUSE_PASSWORD: knowledge
    volumes:
      - clickhouse-dhi-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

configs:
  temporal-dynamic-config:
    content: |
      {}

volumes:
  shared-postgres-dhi:
  qdrant-dhi-data:
  keycloak-dhi-data:
  minio-dhi-data:
  model-cache:
  clickhouse-dhi-data:
