# Unified docker-compose — dev and prod use the same file. Every app
# service (api/worker/ui/keycloak) declares both build: and image: — pick
# which one wins with the command you run:
#
#   Dev (build from source):
#     cp .env.example .env    # fill all secrets
#     docker compose --env-file .env up -d --build
#
#   Deploy (pull pre-built GHCR images, no source checkout needed):
#     cp .env.example .env    # fill all secrets, set IMAGE_TAG
#     docker compose --env-file .env pull
#     docker compose --env-file .env up -d
#
# Profiles:
#   (default) — all core services
#   ops       — also starts temporal-ui and keycloak-ui (already included in keycloak)
#
# Host ports (all bound to 127.0.0.1 for nginx reverse-proxy; override in .env):
#   API          127.0.0.1:${API_HOST_PORT:-8011}:8001
#   UI           127.0.0.1:${UI_HOST_PORT:-3011}:80
#   Keycloak     127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080
#   Temporal     127.0.0.1:7233:7233
#   MinIO API    127.0.0.1:9000:9000
#   MinIO UI     127.0.0.1:9001:9001
#   Temporal UI  127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080  (profile: ops)

services:

  # ---------------------------------------------------------------------------
  # Temporal infrastructure
  # ---------------------------------------------------------------------------
  temporal-db:
    image: dhi.io/postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      # DHI postgres keeps PGDATA at /var/lib/postgresql/15/data (owned by
      # postgres, so a fresh volume is writable). Existing volumes from the
      # old image hold the data dir at their root, so they mount here unchanged.
      - temporal-db-data:/var/lib/postgresql/15/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # DHI has no auto-setup image, so what auto-setup did is split in three:
  # temporal-schema (DB + schema), temporal (the server) and temporal-namespace
  # (the `default` namespace). All three are idempotent.
  temporal-schema:
    image: dhi.io/temporalio-admin-tools:1
    platform: linux/amd64
    depends_on:
      temporal-db:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -u
        T="temporal-sql-tool --plugin postgres12 --ep temporal-db -p 5432 -u temporal --pw temporal"
        S=/etc/temporal/schema/postgresql/v12
        for pair in temporal:temporal visibility:temporal_visibility; do
          dir=$${pair%%:*}; db=$${pair##*:}
          $$T --db $$db create || true
          $$T --db $$db setup-schema -v 0.0 || true
          $$T --db $$db update-schema -d $$S/$$dir/versioned
        done
    restart: "no"

  temporal:
    image: dhi.io/temporalio-server:1
    platform: linux/amd64
    depends_on:
      temporal-db:
        condition: service_healthy
      temporal-schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      # Must match the 4 shards the previous auto-setup image created; fixed
      # for the life of a cluster.
      - NUM_HISTORY_SHARDS=4
      # The image's entrypoint derives these with awk, which the hardened image
      # lacks. Single node: listen everywhere, advertise loopback to itself.
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_BROADCAST_ADDRESS=127.0.0.1
    volumes:
      # The image has no dynamic config file but its server insists on one.
      - ./temporal/dynamicconfig/docker.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      # No tctl in the server image; a TCP connect to the frontend is enough.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7233"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  temporal-namespace:
    # Uses the app image's Temporal SDK: the CLI in dhi.io/temporalio-admin-tools
    # cannot connect to this server (gRPC check times out), the SDK can.
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    platform: linux/amd64
    depends_on:
      temporal:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import asyncio
        from google.protobuf.duration_pb2 import Duration
        from temporalio.client import Client
        from temporalio.api.workflowservice.v1 import (
            DescribeNamespaceRequest, RegisterNamespaceRequest)
        from temporalio.service import RPCError, RPCStatusCode

        async def main():
            svc = (await Client.connect("temporal:7233")).workflow_service
            try:
                await svc.describe_namespace(DescribeNamespaceRequest(namespace="default"))
                print("namespace default exists")
            except RPCError as e:
                if e.status != RPCStatusCode.NOT_FOUND:
                    raise
                await svc.register_namespace(RegisterNamespaceRequest(
                    namespace="default",
                    workflow_execution_retention_period=Duration(seconds=72 * 3600)))
                print("namespace default created")

        asyncio.run(main())
    restart: "no"

  temporal-ui:
    image: dhi.io/temporalio-ui:2
    platform: linux/amd64
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080"
    restart: unless-stopped
    profiles:
      - ops

  # ---------------------------------------------------------------------------
  # MinIO object storage
  # ---------------------------------------------------------------------------
  minio:
    image: dhi.io/minio:latest
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # DHI minio has no curl; bash is /bin/sh there, so probe over /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *' 200 '* ]]"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # No bucket-init job: the API creates MINIO_BUCKET at startup (pipeline/api.py
  # lifespan), and no DHI image exists for the `mc` client the job needed.

  # ---------------------------------------------------------------------------
  # Qdrant — DEV vector index (see docs/SYSTEM_DESIGN.md's DEV vs PROD dual
  # indexing). api/worker's VECTOR_DB_URL is always pointed at this bundled
  # instance below (same as TEMPORAL_HOST/MINIO_ENDPOINT) — there's no
  # external-DEV-Qdrant override inside Docker; run the app outside Docker
  # entirely if you need VECTOR_DB_URL to mean something else.
  # PROD_VECTOR_DB_URL is never bundled — promotion to PROD always targets a
  # real, separately-managed deployment, on purpose.
  # ---------------------------------------------------------------------------
  qdrant:
    image: dhi.io/qdrant:1
    platform: linux/amd64
    environment:
      # The DHI image has no fixed working dir, so pin the storage path to the
      # one the volume has always been mounted at.
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    # No healthcheck: the DHI image has no shell, curl or wget to probe with,
    # so dependents wait on service_started instead.
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak's database — bundled by default so the stack works out of the
  # box with no external infra required. A deployment that wants to point at
  # its own/shared Postgres instead (e.g. OAN prod, which shares one Postgres
  # host with oan-notification-service) can still do so: just set KC_DB_HOST
  # (and KC_DB_SSLMODE=require) in .env to override this service entirely —
  # nothing here forces you onto the bundled one, it's only the default.
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: dhi.io/postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/15/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak (auth) — built from keycloak/Dockerfile (Docker Hardened Image
# base, dhi.io/keycloak; needs `docker login dhi.io`) which pre-installs the
  # email-OTP 2FA plugin (mesutpiskin/keycloak-2fa-email-authenticator).
  #
  # SMTP details come exclusively from .env (KC_SMTP_* vars) — nothing is
  # hard-coded in the image or in this file.
  #
  # First-boot: --import-realm loads keycloak/import/*.json automatically.
  # Subsequent boots: the flag is a no-op when the realm already exists.
  # ---------------------------------------------------------------------------
  keycloak:
    image: ghcr.io/openagrinet/knowledge-provider-keycloak:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: ./keycloak
      dockerfile: Dockerfile
      # No ARGs that reference secrets — JAR URL is a public GitHub URL.
    depends_on:
      keycloak-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DB connection — defaults to the bundled keycloak-db above.
      # KC_DB_HOST/PORT/NAME/SSLMODE in .env override to point elsewhere
      # (e.g. an external shared Postgres in production).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST:-keycloak-db}:${KC_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}?sslmode=${KC_DB_SSLMODE:-disable}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # Admin account bootstrap (Keycloak 26.x var names).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Hostname — update KC_HOSTNAME in .env to your public URL in prod.
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # When nginx proxies /auth/ → container, tell Keycloak the path prefix.
      # This makes issuer URLs, JWKS URLs, and redirect URIs all include /auth.
      # For direct container access (dev, no nginx) leave empty or omit.
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      # SMTP (email-OTP plugin reads the realm's SMTP settings; Keycloak
      # picks these up and writes them into the realm on first import, or
      # you can configure them in the Admin UI → Realm settings → Email).
      KC_SPI_EMAIL_SENDER_HOST: ${KC_SMTP_HOST}
      KC_SPI_EMAIL_SENDER_PORT: ${KC_SMTP_PORT:-587}
      KC_SPI_EMAIL_SENDER_FROM: ${KC_SMTP_FROM}
      KC_SPI_EMAIL_SENDER_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-BharatVistaar}
      KC_SPI_EMAIL_SENDER_AUTH: ${KC_SMTP_AUTH:-true}
      KC_SPI_EMAIL_SENDER_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_SPI_EMAIL_SENDER_SSL: ${KC_SMTP_SSL:-false}
      KC_SPI_EMAIL_SENDER_USER: ${KC_SMTP_USERNAME}
      KC_SPI_EMAIL_SENDER_PASSWORD: ${KC_SMTP_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    # --import-realm is a no-op if the realm already exists, so safe to leave on.
    command: start --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak bootstrap — one-shot that runs once Keycloak is up: creates the
  # roles + /global and /states/{CODE} groups + groups-claim mapper, and adds the
  # users in BOOTSTRAP_SUPER_ADMIN_EMAILS / BOOTSTRAP_STATE_USERS (.env).
  # Idempotent; scripts/ is mounted rather than baked into the app image.
  # ---------------------------------------------------------------------------
  keycloak-bootstrap:
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    platform: linux/amd64
    depends_on:
      keycloak:
        condition: service_started
    env_file:
      - .env
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080${KC_HTTP_RELATIVE_PATH:-/auth}
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080${KC_HTTP_RELATIVE_PATH:-/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_BOOTSTRAP_REALM:-docs-pipeline}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_BOOTSTRAP_REALM:-docs-pipeline}
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./scripts:/app/scripts:ro
    command: python /app/scripts/bootstrap_local_keycloak.py
    restart: "no"

  # ---------------------------------------------------------------------------
  # Pipeline API
  # The image is built once; dev vs prod is controlled by .env values.
  # env_file loads all config; environment: only overrides Docker-network
  # addresses and container paths (these must win over localhost values in .env).
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Docker-network overrides — these replace the localhost values in .env
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      VECTOR_DB_URL: http://qdrant:6333
      DOCUMENT_DB_PATH: /data/documents.db
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      # HF cache path propagated into the container
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8011}:8001"
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      keycloak:
        condition: service_started
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8001
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline Worker
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/openagrinet/knowledge-provider:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      VECTOR_DB_URL: http://qdrant:6333
      DOCUMENT_DB_PATH: /data/documents.db
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_started
    command: python -m pipeline.worker
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React UI
  # Dockerfile.prod builds a static nginx image; VITE_* args come from .env.
  # ---------------------------------------------------------------------------
  ui:
    image: ghcr.io/openagrinet/knowledge-provider-ui:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
      # Measured on the sandbox host: default bridge networking adds ~30x
      # latency per request (3.18s vs 0.07s with host networking), which
      # compounds across npm ci's hundreds of per-package requests into a
      # multi-minute+ hang. Host networking during build avoids that.
      network: host
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/docs-pipeline-api}
        VITE_BASE: ${VITE_BASE:-/docs-pipeline/}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
        VITE_KEYCLOAK_IDP_HINT: ${VITE_KEYCLOAK_IDP_HINT:-}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-3011}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-db-data:
  qdrant-data:
  keycloak-db-data:
  keycloak-data:
  minio-data:
  sqlite-data:
  documents-data:
